name: Tibo Reset Monitor

on:
  schedule:
    - cron: "17 */6 * * *"
      timezone: "Asia/Shanghai"

  workflow_dispatch:
    inputs:
      send_test:
        description: "发送一条飞书测试通知"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: tibo-reset-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check reset signals
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          SEND_TEST: ${{ inputs.send_test }}
        run: python monitor.py

      - name: Save monitor state
        shell: bash
        run: |
          if ! git diff --quiet -- state.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "chore: update monitor state [skip ci]"
            git push
          else
            echo "state.json unchanged"
          fi
